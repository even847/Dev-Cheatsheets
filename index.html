<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev-Cheatsheets</title>
<meta name="description" content="Referencias rápidas de comandos, interactivas y copiables.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><img class="logo" src="assets/favicon.svg" alt="" width="30" height="30">Dev-Cheatsheets</a>
  <span class="spacer"></span>
  <button id="theme" class="icon-btn" type="button"></button>
</header>

<section class="hero">
  <h1>Comandos a un clic.</h1>
  <p>Elige una herramienta, salta a la sección que necesitas y copia el comando. Sin buscar en PDFs.</p>
  <div class="hero-row">
    <div class="search">
      <input id="q" type="search" placeholder="Buscar en todas las guías…" aria-label="Buscar en todas las guías" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <a class="favbtn" href="favoritos.html" title="Ver tus comandos favoritos">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      <span>Favoritos</span><span class="badge" id="fav-count">0</span>
    </a>
  </div>
</section>

<div id="grid" class="grid"></div>
<div id="results" class="results" hidden></div>

<script src="data/registry.js"></script>
<script src="assets/logos.js"></script>
<script src="assets/index.js"></script>
</body>
</html>
